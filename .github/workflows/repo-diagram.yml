name: Repo Diagram

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  update-diagram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update diagram
        uses: githubocto/repo-visualizer@main
        with:
          excluded_paths: "target,.idea,.github"

